services:
  mysql:
    image: mysql:8.4
    container_name: comfort-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: comfort
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - comfort_mysql:/var/lib/mysql

volumes:
  comfort_mysql:
